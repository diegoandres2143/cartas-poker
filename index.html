<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Absolute</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="./img/favicon.png">
</head>

<body>
    <h1>Cartas de Poker</h1>
    
    <div class="contenedor">
        
        <div class="card roja">
            <div class="izquierda">
                <p>A<br>♥</p>
            </div>
            <div class="medio">
                <p>♥</p>
            </div>
            <div class="derecha reverso">
                <p>A<br>♥</p>
            </div>
        </div>

        <div class="card">
            <div class="izquierda">
                <p>2<br>♣</p>
            </div>
            <div class="medio">
                <p>♣<br>♣</p>
            </div>
            <div class="derecha reverso">
                <p>2<br>♣</p>
            </div>
        </div>
        <div class="card roja">
            <div class="izquierda">
                <p>3<br>♦</p>
            </div>
            <div class="medio">
                <p>♦<br>♦<br>♦</p>
            </div>
            <div class="derecha reverso">
                <p>3<br>♦</p>
            </div>
        </div>
        <div class="card">
            <div class="izquierda">
                <p>4<br>♠</p>
            </div>
            <div class="medio">
                <p>♠ ♠<br>♠ ♠</p>
            </div>
            <div class="derecha reverso">
                <p>4<br>♠</p>
            </div>
        </div>
        <div class="card roja">
            <div class="izquierda">
                <p>5<br>♥</p>
            </div>
            <div class="medio">
                <p>♥ ♥<br>♥<br>♥ ♥</p>
            </div>
            <div class="derecha reverso">
                <p>A<br>♠</p>
            </div>
        </div>
        <div class="card">
            <div class="izquierda">
                <p>6<br>♣</p>
            </div>
            <div class="medio">
                <p>♣ ♣<br>♣ ♣<br>♣ ♣</p>
            </div>
            <div class="derecha reverso">
                <p>6<br>♣</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
